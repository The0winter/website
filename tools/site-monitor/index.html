<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>拾页 · 网站监控</title><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/vendor/bootstrap.min.css"><link rel="stylesheet" href="/app.css"></head>
<body>
  <aside class="sidebar">
    <div class="brand"><img src="/icon.svg" alt="" width="38" height="38"><div>拾页<span>网站监控</span></div></div>
    <div class="nav-label">工作空间</div>
    <nav aria-label="主导航">
      <button class="nav-item active" data-page="overview"><span aria-hidden="true">◫</span>总览</button>
      <button class="nav-item" data-page="server"><span aria-hidden="true">▤</span>服务器</button>
      <button class="nav-item" data-page="atlas"><span aria-hidden="true">▥</span>Atlas 数据库</button>
      <button class="nav-item" data-page="r2"><span aria-hidden="true">◇</span>R2 存储</button>
    </nav>
    <div class="nav-label second">本地工具</div>
    <nav aria-label="本地工具">
      <button class="nav-item" data-page="reports"><span aria-hidden="true">▧</span>报告与清理</button>
      <button class="nav-item" data-page="settings"><span aria-hidden="true">⚙</span>连接设置</button>
    </nav>
    <div class="sidebar-bottom"><span class="mode-dot"></span>按需运行 · 只读采集<p>关闭窗口即停止监控</p></div>
  </aside>
  <main>
    <header class="topbar"><div class="site-address">jiutianxiaoshuo.com <span class="local-tag">LOCAL</span></div><div id="session-clock">本次运行 00:00</div></header>
    <div class="workspace">
      <div class="page-heading"><div><div class="eyebrow">SHIYE / MONITOR</div><h1 id="page-title">网站运行总览</h1><p id="page-description">资源余量、服务状态与本次运行趋势。</p></div><div class="actions"><button class="btn btn-light" id="pause">暂停刷新</button><button class="btn btn-outline-secondary" id="save">保存报告</button><button class="btn btn-primary" id="refresh">刷新全部</button></div></div>
      <div id="connection-banner" role="status" hidden></div>
      <div id="content" aria-live="off"><div class="panel empty-state">正在连接，首轮数据将逐项显示…</div></div>
      <footer><span>数据仅驻留内存，保存报告后才写入本地</span><span id="next-refresh">正在采集</span></footer>
    </div>
  </main>
  <div id="toast" role="status" hidden></div>
  <dialog id="export-dialog"><form method="dialog"><div class="dialog-heading"><h2>保存本次监控</h2><button class="close-dialog" aria-label="关闭">×</button></div></form><p class="text-secondary">保存到项目专用报告目录。默认保留 30 天，总量上限 200 MB。</p><div class="dialog-actions"><button class="btn btn-primary" data-export="json">保存完整 JSON</button><button class="btn btn-outline-secondary" data-export="csv">保存曲线 CSV</button></div><p class="small text-secondary mt-3 mb-0">不包含密钥、登录信息或正文。</p></dialog>
  <dialog id="cleanup-dialog"><form method="dialog"><div class="dialog-heading"><h2>清理预览</h2><button class="close-dialog" aria-label="关闭">×</button></div></form><div id="cleanup-preview"></div><button class="btn btn-primary mt-3" id="apply-cleanup">清理这些文件</button></dialog>
  <script src="/app.js" type="module"></script>
</body></html>
