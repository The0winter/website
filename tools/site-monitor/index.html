<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>拾页 · 网站监控</title><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/app.css"></head>
<body>
  <aside class="sidebar">
    <div class="brand"><img src="/icon.svg" alt="" width="40" height="40"><div>拾页<span>网站监控</span></div></div>
    <div class="nav-label">看网站，也看读者</div>
    <nav aria-label="主导航">
      <button class="nav-item active" data-page="overview" aria-current="page"><span aria-hidden="true">◫</span>运行概况</button>
      <button class="nav-item" data-page="audience"><span aria-hidden="true">↗</span>访客与内容</button>
      <button class="nav-item" data-page="resources"><span aria-hidden="true">▥</span>容量与服务</button>
      <button class="nav-item" data-page="storage"><span aria-hidden="true">▤</span>正文与封面</button>
    </nav>
    <div class="nav-label second">管理</div>
    <nav aria-label="管理工具">
      <button class="nav-item" data-page="reports"><span aria-hidden="true">▧</span>报告与清理</button>
      <button class="nav-item" data-page="settings"><span aria-hidden="true">⚙</span>连接设置</button>
    </nav>
    <div class="sidebar-bottom"><span class="mode-dot"></span>本机只读检测<p>关闭窗口后停止检测<br>网站与谷歌继续记录访问</p></div>
  </aside>
  <main>
    <header class="topbar"><div class="site-address">jiutianxiaoshuo.com</div><span id="session-clock">正在连接</span></header>
    <div class="workspace">
      <div class="page-heading"><div><div class="eyebrow">SHIYE / MONITOR</div><h1 id="page-title">网站现在怎么样</h1><p id="page-description">先看是否正常，再看哪里需要留意。</p></div><div class="actions"><button class="btn quiet" id="pause">暂停刷新</button><button class="btn primary" id="refresh">立即检测</button></div></div>
      <div id="connection-banner" role="status" hidden></div>
      <div id="content" aria-live="off"><div class="panel empty-state">正在连接，检测结果会陆续出现…</div></div>
      <footer><span>运行趋势仅记录本次打开期间 · 访问趋势来自历史报表</span><span id="next-refresh">正在检测</span></footer>
    </div>
  </main>
  <div id="toast" role="status" hidden></div>
  <dialog id="export-dialog"><form method="dialog"><div class="dialog-heading"><h2>保存本次监控</h2><button class="close-dialog" aria-label="关闭">×</button></div></form><p>保存到本机，保留 30 天，报告目录最多 200 MiB。</p><div class="actions"><button class="btn primary" data-export="json">保存完整 JSON</button><button class="btn" data-export="csv">保存运行曲线 CSV</button></div><p class="caption">完整报告包含当前可用的汇总统计；不包含密钥、用户名或正文。</p></dialog>
  <dialog id="cleanup-dialog"><form method="dialog"><div class="dialog-heading"><h2>清理预览</h2><button class="close-dialog" aria-label="关闭">×</button></div></form><div id="cleanup-preview"></div><button class="btn primary" id="apply-cleanup">清理这些文件</button></dialog>
  <script src="/app.js" type="module"></script>
</body></html>
