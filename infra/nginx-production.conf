# Candidate template: replace only the domain and certificate paths after target approval.
limit_req_zone $binary_remote_addr zone=test1_public:10m rate=50r/s;
upstream test1_api { server 127.0.0.1:5000; keepalive 32; }
upstream test1_web { server 127.0.0.1:3000; keepalive 32; }
log_format test1_json escape=json '{"time":"$time_iso8601","requestId":"$request_id","apiRequestId":"$upstream_http_x_request_id","method":"$request_method","path":"$uri","status":$status,"seconds":$request_time}';
server {
    listen 80;
    server_name candidate.example.test;
    return 308 https://candidate.example.test$request_uri;
}
server {
    listen 443 ssl;
    server_name candidate.example.test;
    ssl_certificate /etc/test1/tls/fullchain.pem;
    ssl_certificate_key /etc/test1/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/test1-access.log test1_json;
    error_log /var/log/nginx/test1-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    client_max_body_size 256k;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    limit_req zone=test1_public burst=100 nodelay;
    limit_req_status 429;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host candidate.example.test;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Internal-Api-Secret "";
    location = /health/metrics { deny all; }
    location /health/ { proxy_pass http://test1_api; }
    location = /api/admin/upload-book { client_max_body_size 10m; proxy_pass http://test1_api; }
    location = /api/upload/cover { client_max_body_size 2m; proxy_pass http://test1_api; }
    location /api/ { proxy_pass http://test1_api; }
    location / { proxy_pass http://test1_web; }
}
