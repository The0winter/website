# Standby entry only. Enable after provisioning the certificate below.
# The primary website and its application configuration remain unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name jiutianzw.com www.jiutianzw.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 302 https://jiutianxiaoshuo.com$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jiutianzw.com www.jiutianzw.com;
    ssl_certificate /etc/letsencrypt/live/jiutianzw.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiutianzw.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 302 https://jiutianxiaoshuo.com$request_uri;
}
