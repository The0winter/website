# Include inside the HTTPS application server. Only immutable build assets use
# precompressed responses. Missing files/unsupported encodings fall back to Next,
# including rollback releases built before precompression was added.
location ~ ^/_next/static/(?<test1_js_asset>[A-Za-z0-9_./-]+\.js)$ {
    error_page 418 = @test1_original_static;
    if ($http_accept_encoding !~* "(^|,)\s*br\s*(,|$)") { return 418; }
    root /srv/test1/current/web-next/.next-candidate;
    try_files /static/$test1_js_asset.br @test1_original_static;
    types { }
    default_type application/javascript;
    charset utf-8;
    gzip off;
    add_header Content-Encoding br;
    add_header Vary Accept-Encoding always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}
location ~ ^/_next/static/(?<test1_css_asset>[A-Za-z0-9_./-]+\.css)$ {
    error_page 418 = @test1_original_static;
    if ($http_accept_encoding !~* "(^|,)\s*br\s*(,|$)") { return 418; }
    root /srv/test1/current/web-next/.next-candidate;
    try_files /static/$test1_css_asset.br @test1_original_static;
    types { }
    default_type text/css;
    charset utf-8;
    gzip off;
    add_header Content-Encoding br;
    add_header Vary Accept-Encoding always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}
location @test1_original_static { proxy_pass http://test1_web; }
